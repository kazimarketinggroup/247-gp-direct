<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Illustration of an online doctor consultation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="655" cy="95" r="120" fill="#5eead4" opacity="0.45"/>
  <circle cx="120" cy="430" r="95" fill="#2dd4bf" opacity="0.3"/>

  <!-- device frame -->
  <rect x="215" y="95" width="370" height="290" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
  <rect x="240" y="120" width="320" height="200" rx="14" fill="#0f766e" opacity="0.08"/>

  <!-- doctor -->
  <circle cx="400" cy="196" r="42" fill="#f8fafc" stroke="#0f766e" stroke-width="4"/>
  <path d="M362 196a38 38 0 0 1 76 0" fill="#0f766e" opacity="0.85"/>
  <circle cx="386" cy="200" r="4.5" fill="#0f172a"/>
  <circle cx="414" cy="200" r="4.5" fill="#0f172a"/>
  <path d="M388 216a16 16 0 0 0 24 0" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M336 320c0-38 29-66 64-66s64 28 64 66z" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
  <path d="M382 256l18 26 18-26" stroke="#0f766e" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- stethoscope accent -->
  <path d="M362 262c-6 30 8 50 30 52" stroke="#14b8a6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="396" cy="318" r="9" fill="#14b8a6"/>

  <!-- call controls -->
  <rect x="300" y="336" width="200" height="30" rx="15" fill="#0f766e" opacity="0.12"/>
  <circle cx="345" cy="351" r="10" fill="#0f766e"/>
  <circle cx="400" cy="351" r="10" fill="#14b8a6"/>
  <circle cx="455" cy="351" r="10" fill="#ef4444"/>

  <!-- floating chat bubbles -->
  <rect x="92" y="150" width="120" height="54" rx="18" fill="#ffffff" opacity="0.95"/>
  <rect x="112" y="170" width="66" height="7" rx="3.5" fill="#0f766e" opacity="0.5"/>
  <rect x="112" y="184" width="44" height="7" rx="3.5" fill="#0f766e" opacity="0.3"/>

  <rect x="596" y="286" width="126" height="54" rx="18" fill="#ffffff" opacity="0.95"/>
  <rect x="616" y="306" width="72" height="7" rx="3.5" fill="#0f766e" opacity="0.5"/>
  <rect x="616" y="320" width="48" height="7" rx="3.5" fill="#0f766e" opacity="0.3"/>

  <!-- 24/7 badge -->
  <circle cx="646" cy="150" r="46" fill="#0f766e"/>
  <text x="646" y="160" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">24/7</text>
</svg>
